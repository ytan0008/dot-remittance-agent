<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f2">
  <meta name="color-scheme" content="light dark">
  <title>DOT · Remittance Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='black'/%3E%3Ccircle cx='16' cy='16' r='4' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div id="intro" aria-hidden="true"><i></i><b></b></div>
  <div id="progress" aria-hidden="true"></div>
  <a class="skip" href="#main" data-i18n="shell.skip">Skip to content</a>

  <aside class="sidebar" aria-label="Primary">
    <a class="brand" href="#overview" aria-label="DOT">
      <span class="brand-mark"><i></i></span><span class="brand-word">dot<em>.</em></span>
      <small data-i18n="shell.tagline">Remittance agent</small>
    </a>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="side-orbit" aria-hidden="true"><i></i><b></b><s></s></div>
      <p data-i18n="shell.motto">Every action has a clear boundary.</p>
      <div class="side-status"><span class="pulse"></span><span id="side-status" data-i18n="shell.connecting">Connecting</span></div>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="crumbs"><span data-i18n="shell.workspace">Workspace</span><i></i><b id="crumb"></b></div>
      <div class="top-actions">
        <span id="env-badge" class="env-badge"><i></i><span></span></span>
        <label class="lang-select"><span class="sr-only" data-i18n="settings.language">Language</span>
          <select id="lang-select" aria-label="Language"></select>
        </label>
        <button class="icon-button" id="theme-toggle" data-i18n-label="shell.theme" aria-label="Theme"><span class="theme-icon"></span></button>
        <button class="icon-button" id="bell" data-i18n-label="shell.reminders" aria-label="Reminders"><span class="bell-icon"></span><b id="bell-count" hidden></b></button>
        <button class="icon-button" id="refresh" data-i18n-label="shell.refresh" aria-label="Refresh">↻</button>
        <button class="avatar-button" id="account" data-i18n-label="shell.account" aria-label="Account"><span id="avatar">·</span></button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div id="banner" class="banner" hidden></div>
      <section id="view" aria-live="polite"></section>
      <footer class="foot"><span><i></i> DOT / REMITTANCE AGENT</span><span id="sync"></span></footer>
    </main>
  </div>

  <nav class="dock" id="dock" aria-label="Mobile"></nav>
  <div class="sheet" id="sheet" hidden><div class="sheet-panel" id="sheet-panel"></div></div>
  <aside class="drawer" id="drawer" hidden aria-label="Reminders"><div class="drawer-panel" id="drawer-panel"></div></aside>

  <dialog id="modal"><div class="modal-shell"><div class="modal-head"><span id="modal-eyebrow" class="eyebrow"></span><button class="icon-button" id="modal-close" data-i18n-label="common.close" aria-label="Close">×</button></div><div id="modal-body"></div></div></dialog>
  <div id="toast" role="status" popover="manual" hidden></div>
</body>
</html>
